<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5ec8ff">
<title>Aereo Stelline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: one full-screen canvas sky, HTML overlays for the few giant buttons a 4-year-old needs. Single bright daytime look, no dark variant on purpose. */
:root{
  --sky-top:#5ec8ff; --sky-bottom:#dff6ff;
  --sun:#ffd54a; --ink:#1d3557; --card:#ffffff;
  --btn:#ff6f3c; --btn-2:#3ccf91; --btn-3:#ff4fa3;
  --display:"Baloo 2","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--sky-bottom);color:var(--ink);font-family:var(--display);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--sky-bottom)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;text-align:center}
#menu{background:rgba(255,255,255,.18)}
h1{margin:0;font-size:clamp(40px,10vw,84px);font-weight:800;line-height:1;color:#fff;text-shadow:0 4px 0 #2a7fb8,0 8px 18px rgba(0,60,120,.35);letter-spacing:.01em;text-wrap:balance}
.sub{margin:0;font-size:clamp(18px,3.5vw,26px);font-weight:700;color:var(--ink);background:var(--card);padding:8px 18px;border-radius:999px;box-shadow:0 4px 12px rgba(0,60,120,.2)}
.planes{display:flex;gap:clamp(10px,3vw,22px);flex-wrap:wrap;justify-content:center}
.plane-pick{width:clamp(78px,20vw,120px);height:clamp(78px,20vw,120px);border-radius:28px;border:6px solid #fff;background:var(--card);box-shadow:0 6px 0 rgba(0,60,120,.25);cursor:pointer;padding:0;display:grid;place-items:center;transition:transform .15s}
.plane-pick:active{transform:scale(.94)}
.plane-pick[aria-pressed="true"]{border-color:var(--sun);transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,213,74,.5),0 6px 0 rgba(0,60,120,.25)}
.plane-pick svg{width:80%;height:80%}
.big{font:inherit;font-weight:800;font-size:clamp(28px,6vw,46px);color:#fff;background:var(--btn);border:0;border-radius:999px;padding:.45em 1.3em;cursor:pointer;
  box-shadow:0 8px 0 #c94a1d,0 14px 24px rgba(0,60,120,.3);transition:transform .1s;min-width:60vw;max-width:100%}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #c94a1d}
.big:focus-visible,.round:focus-visible,.plane-pick:focus-visible{outline:5px solid var(--sun);outline-offset:3px}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
.score{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 18px 6px 10px;font-size:clamp(28px,6vw,44px);font-weight:800;color:var(--ink);box-shadow:0 4px 12px rgba(0,60,120,.25);font-variant-numeric:tabular-nums}
.score svg{width:1.1em;height:1.1em}
.score.level{font-size:clamp(16px,3.5vw,24px);padding:8px 16px;align-self:center}
#hud{gap:8px}
.hud-left{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;flex:1}
.score.lives{font-size:clamp(18px,4vw,28px);padding:8px 12px;gap:3px}
.score.lives svg{width:1em;height:1em}
.score.lives svg.lost{opacity:.22;filter:grayscale(1)}
.score.timer{font-size:clamp(22px,5vw,36px);padding:6px 16px 6px 10px}
.score.timer.low{background:#ff4f4f;color:#fff;animation:pulse .6s ease-in-out infinite}
.round.pause{background:#3b82f6}
.overlay{background:rgba(29,53,87,.35);overflow-y:auto;justify-content:safe center;z-index:5}
.overlay h1{font-size:clamp(36px,9vmin,80px)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.big.alt{min-width:0;font-size:clamp(20px,4.5vmin,32px);background:var(--btn-3);box-shadow:0 6px 0 #c21d72,0 10px 18px rgba(0,60,120,.3)}
.big.alt:active{box-shadow:0 2px 0 #c21d72}
.sun-btn{width:clamp(110px,28vmin,200px);height:clamp(110px,28vmin,200px);max-width:100%;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;animation:pulse 1.2s ease-in-out infinite}
.sun-btn svg{width:100%;height:100%;display:block}
.sun-btn .rays{transform-origin:50px 50px;animation:spin 8s linear infinite}
.sun-btn:focus-visible{outline:5px solid #fff;outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hud-btns{display:flex;gap:10px;pointer-events:auto}
.round{width:clamp(50px,11vw,64px);height:clamp(50px,11vw,64px);border-radius:50%;border:4px solid #fff;background:var(--btn-2);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,60,120,.25);padding:0}
.round.home{background:var(--btn-3)}
.round svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,60,120,.25)}
#bravo{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
#bravo>div{display:grid;gap:12px;justify-items:center}
#level-name{font-size:clamp(22px,5vw,36px)}
#bravo span{font-size:clamp(52px,16vw,140px);font-weight:800;color:#fff;text-shadow:0 6px 0 #ff6f3c,0 12px 28px rgba(0,60,120,.4);animation:pop .9s ease-out both}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}30%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border-radius:999px;padding:8px 20px;font-size:clamp(16px,3.5vw,24px);font-weight:700;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 12px rgba(0,60,120,.2);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#hint,#bravo span,.sun-btn,.sun-btn .rays,.score.timer.low{animation:none}}
</style>
</head>
<body>

<canvas id="game" aria-label="Cielo con l'aereo"></canvas>

<div id="hud" hidden>
  <div class="hud-left">
  <div class="score"><svg viewBox="0 0 24 24"><path fill="#ffd54a" stroke="#f0a500" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.6L12 17.4l-5.9 3.2 1.2-6.6L2.5 9.4l6.6-.9z"/></svg><span id="score">0</span></div>
  <div class="score level" id="level-pill">Livello <span id="level">1</span></div>
  <div class="score lives" id="lives" role="img" aria-label="5 vite"></div>
  <div class="score timer" id="timer-pill" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span id="timer">60</span></div>
  </div>
  <div class="hud-btns">
    <button class="round pause" id="pause-btn" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="round" id="mute" aria-label="Suono"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="mute-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button class="round home" id="home" aria-label="Torna al menu"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg></button>
  </div>
</div>
<div id="hint" hidden>Tocca lo schermo e vola! Non toccare terra!</div>
<div id="bravo" hidden><div><span id="bravo-text">BRAVO!</span><div id="level-name" class="sub" hidden>Cielo</div></div></div>

<div class="ui overlay" id="pause" hidden>
  <h1>Pausa</h1>
  <button class="big" id="resume">CONTINUA</button>
  <button class="big alt" id="pause-home">MENU</button>
</div>

<div class="ui overlay" id="over" hidden>
  <h1>Oh no!</h1>
  <p class="sub">Tocca il sole per volare ancora un minuto!</p>
  <button class="sun-btn" id="sun" aria-label="Tocca il sole: ancora un minuto"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" stroke="#ffb300" stroke-width="7" stroke-linecap="round">
<path d="M50 4v12M50 84v12M4 50h12M84 50h12M17.5 17.5l8.5 8.5M74 74l8.5 8.5M17.5 82.5l8.5-8.5M74 26l8.5-8.5"/></g>
<circle cx="50" cy="50" r="30" fill="#ffd54a" stroke="#f0a500" stroke-width="3"/>
<circle cx="40" cy="45" r="3.5" fill="#1d3557"/><circle cx="60" cy="45" r="3.5" fill="#1d3557"/>
<circle cx="34" cy="56" r="4" fill="#ff9f8a" opacity=".7"/><circle cx="66" cy="56" r="4" fill="#ff9f8a" opacity=".7"/>
<path d="M39 56q11 11 22 0" fill="none" stroke="#1d3557" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <div class="row"><div class="score"><svg viewBox="0 0 24 24"><path fill="#ffd54a" stroke="#f0a500" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.6L12 17.4l-5.9 3.2 1.2-6.6L2.5 9.4l6.6-.9z"/></svg><span id="over-score">0</span></div><button class="big alt" id="over-home">MENU</button></div>
</div>

<div class="ui overlay" id="end" hidden>
  <h1>Fine!</h1>
  <p class="sub">Bravissimo! Hai raccolto</p>
  <div class="score"><svg viewBox="0 0 24 24"><path fill="#ffd54a" stroke="#f0a500" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.6L12 17.4l-5.9 3.2 1.2-6.6L2.5 9.4l6.6-.9z"/></svg><span id="end-score">0</span></div>
  <div class="row"><button class="big" id="again">GIOCA ANCORA</button><button class="big alt" id="end-home">MENU</button></div>
</div>

<div class="ui" id="menu">
  <h1>Aereo Stelline</h1>
  <p class="sub">Scegli il tuo aereo</p>
  <div class="planes" id="planes"></div>
  <button class="big" id="play">GIOCA!</button>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const menu = document.getElementById('menu'), hud = document.getElementById('hud'), hint = document.getElementById('hint');
const bravoEl = document.getElementById('bravo'), bravoText = document.getElementById('bravo-text');
const pauseEl = document.getElementById('pause'), overEl = document.getElementById('over'), endEl = document.getElementById('end');
const livesEl = document.getElementById('lives'), timerPill = document.getElementById('timer-pill'), timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score'), levelName = document.getElementById('level-name'), muteBtn = document.getElementById('mute'), muteWaves = document.getElementById('mute-waves');

const PLANES = [
  {body:'#ff4f4f', wing:'#ffd54a', name:'rosso'},
  {body:'#3b82f6', wing:'#ffffff', name:'blu'},
  {body:'#3ccf91', wing:'#ffd54a', name:'verde'},
  {body:'#ff4fa3', wing:'#ffffff', name:'rosa'},
];
let planeIdx = 0;
try { planeIdx = Math.min(3, Math.max(0, +localStorage.getItem('aereo.plane') || 0)); } catch(e){}

const BALLOON_COLORS = ['#ff4f4f','#ff4fa3','#3b82f6','#3ccf91','#ffd54a','#a855f7','#fb923c'];
const PRAISE = ['BRAVO!','EVVIVA!','WOW!','FANTASTICO!','SUPER!'];

let W=0,H=0,dpr=1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- audio (synthesised, no files) ---------- */
let AC=null, master=null, engine=null, muted=false;
try { muted = localStorage.getItem('aereo.muted')==='1'; } catch(e){}
function audioInit(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.8; master.connect(AC.destination);
    const osc = AC.createOscillator(); osc.type='sawtooth'; osc.frequency.value=70;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
    const g = AC.createGain(); g.gain.value=0;
    osc.connect(lp); lp.connect(g); g.connect(master); osc.start();
    engine = {osc,g};
  } catch(e){ AC=null; }
}
function setMuted(m){ muted=m; if(master) master.gain.value = m?0:0.8; muteWaves.style.opacity = m?0.25:1; try{localStorage.setItem('aereo.muted',m?'1':'0');}catch(e){} }
muteBtn.addEventListener('click', ()=>{ audioInit(); setMuted(!muted); });
setMuted(muted);
function chime(step){ // rising pentatonic for consecutive stars
  if(!AC) return;
  const notes=[523,587,659,784,880,1047,1175,1319];
  const f = notes[step%notes.length], t=AC.currentTime;
  for (const [mult,vol] of [[1,0.35],[2,0.12]]) {
    const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f*mult;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.55);
  }
}
function popSound(){
  if(!AC) return;
  const t=AC.currentTime, len=0.12, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=AC.createBufferSource(); s.buffer=buf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.7;
  const g=AC.createGain(); g.gain.value=0.6;
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
  const o=AC.createOscillator(), og=AC.createGain(); o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(900,t+0.1);
  og.gain.setValueAtTime(0.25,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(og); og.connect(master); o.start(t); o.stop(t+0.16);
}
function fanfare(){
  if(!AC) return;
  const seq=[523,659,784,1047,784,1047], t0=AC.currentTime;
  seq.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f;
    const t=t0+i*0.11; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.4); });
}
function puff(){
  if(!AC) return;
  const t=AC.currentTime, len=0.3, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);
  const s=AC.createBufferSource(); s.buffer=buf; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
  const g=AC.createGain(); g.gain.value=0.15; s.connect(lp); lp.connect(g); g.connect(master); s.start(t);
}

function boomSound(){
  if(!AC) return;
  const t=AC.currentTime, len=0.7, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(); s.buffer=buf; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(1400,t); lp.frequency.exponentialRampToValueAtTime(200,t+0.6);
  const g=AC.createGain(); g.gain.value=0.7; s.connect(lp); lp.connect(g); g.connect(master); s.start(t);
  const o=AC.createOscillator(), og=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(40,t+0.45);
  og.gain.setValueAtTime(0.5,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.5); o.connect(og); og.connect(master); o.start(t); o.stop(t+0.5);
}
function wahWah(){
  if(!AC) return;
  [392,370,349,294].forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; const t=AC.currentTime+i*0.32;
    o.frequency.setValueAtTime(f,t); if(i===3) o.frequency.linearRampToValueAtTime(f*0.94,t+0.6);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+(i===3?0.7:0.3));
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.75); });
}
function tickSound(){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value=1100;
  g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.07);
}

/* ---------- plane drawing (shared by menu buttons and game) ---------- */
function planeSVG(c){
  return `<svg viewBox="-60 -40 120 80" aria-hidden="true">
    <ellipse cx="0" cy="0" rx="46" ry="14" fill="${c.body}"/>
    <path d="M-38 -4 L-56 -30 L-42 -30 L-26 -8 Z" fill="${c.body}" stroke="#1d3557" stroke-width="2"/>
    <path d="M-6 -2 L-22 -30 L-2 -30 L18 -2 Z" fill="${c.wing}" stroke="#1d3557" stroke-width="2"/>
    <path d="M-6 2 L-22 30 L-2 30 L18 2 Z" fill="${c.wing}" stroke="#1d3557" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#1d3557" stroke-width="2.5"/>
    <circle cx="14" cy="-3" r="6" fill="#bfe9ff" stroke="#1d3557" stroke-width="2"/>
    <rect x="44" y="-14" width="5" height="28" rx="2" fill="#1d3557"/>
  </svg>`;
}
function planeScale(){ return Math.min(W,H)/520 + 0.6; }
function drawPlane(x,y,tilt,c,t){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  const s = planeScale(); ctx.scale(s,s);
  ctx.lineWidth=2.5; ctx.strokeStyle='#1d3557'; ctx.lineJoin='round';
  // tail fin
  ctx.fillStyle=c.body; ctx.beginPath(); ctx.moveTo(-38,-4); ctx.lineTo(-56,-30); ctx.lineTo(-42,-30); ctx.lineTo(-26,-8); ctx.closePath(); ctx.fill(); ctx.stroke();
  // far wing
  ctx.fillStyle=c.wing; ctx.beginPath(); ctx.moveTo(-6,-2); ctx.lineTo(-22,-30); ctx.lineTo(-2,-30); ctx.lineTo(18,-2); ctx.closePath(); ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle=c.body; ctx.beginPath(); ctx.ellipse(0,0,46,14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // near wing
  ctx.fillStyle=c.wing; ctx.beginPath(); ctx.moveTo(-6,2); ctx.lineTo(-22,30); ctx.lineTo(-2,30); ctx.lineTo(18,2); ctx.closePath(); ctx.fill(); ctx.stroke();
  // window with a little pilot
  ctx.fillStyle='#bfe9ff'; ctx.beginPath(); ctx.arc(14,-3,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.arc(14,-1,2.5,0,Math.PI*2); ctx.fill();
  // propeller spin
  ctx.save(); ctx.translate(47,0); ctx.rotate(t*40); ctx.fillStyle='#1d3557'; ctx.fillRect(-2.5,-16,5,32); ctx.rotate(Math.PI/2); ctx.fillRect(-2.5,-16,5,32); ctx.restore();
  ctx.restore();
}

/* ---------- menu ---------- */
const planesBox = document.getElementById('planes');
PLANES.forEach((c,i)=>{
  const b=document.createElement('button'); b.className='plane-pick'; b.type='button'; b.innerHTML=planeSVG(c);
  b.setAttribute('aria-label','Aereo '+c.name); b.setAttribute('aria-pressed', i===planeIdx?'true':'false');
  b.addEventListener('click',()=>{ planeIdx=i; try{localStorage.setItem('aereo.plane',i);}catch(e){}
    [...planesBox.children].forEach((el,j)=>el.setAttribute('aria-pressed', j===i?'true':'false')); audioInit(); chime(i*2); });
  planesBox.appendChild(b);
});


/* ---------- levels: every 10 collected the world changes ---------- */
const LEVELS = [
  {name:'Cielo',     top:'#5ec8ff', bot:'#dff6ff', ground:'hills',  sky:'sun',     items:['star','balloon'],           cloudA:0.92, speed:1.0},
  {name:'Tramonto',  top:'#ff8a5c', bot:'#ffd99a', ground:'hills',  sky:'bigsun',  items:['star','heart','balloon'],   cloudA:0.85, speed:1.05},
  {name:'Mare',      top:'#4fb3ff', bot:'#bfe9ff', ground:'sea',    sky:'sun',     items:['star','fish','balloon'],    cloudA:0.9,  speed:1.1},
  {name:'Montagne',  top:'#8fd3ff', bot:'#eef9ff', ground:'mountains', sky:'sun',  items:['star','snow','heart'],      cloudA:0.95, speed:1.1},
  {name:'Notte',     top:'#1b2a6b', bot:'#4a4e9c', ground:'city',   sky:'moon',    items:['star','balloon','heart'],   cloudA:0.35, speed:1.15},
  {name:'Spazio',    top:'#090a2a', bot:'#2a1a5c', ground:'moon',   sky:'stars',   items:['star','planet','rocket'],   cloudA:0.0,  speed:1.2},
  {name:'Giardino',  top:'#7fd8ff', bot:'#e8ffe0', ground:'meadow', sky:'sun',     items:['star','flower','butterfly'],cloudA:0.9,  speed:1.2},
  {name:'Dolci',     top:'#ffb3d9', bot:'#ffe9f5', ground:'hills',  sky:'bigsun',  items:['star','candy','balloon'],   cloudA:0.95, speed:1.25},
  {name:'Arcobaleno',top:'#6ad1ff', bot:'#fff5c2', ground:'meadow', sky:'rainbow', items:['star','heart','balloon','candy','fish'], cloudA:0.9, speed:1.3},
];
const PER_LEVEL = 10;
let levelIdx = 0, levelBlend = 1, prevLevel = LEVELS[0], levelTimer = 0, skyStars = [], groundOff = 0, fishJump = [];
for (let i=0;i<70;i++) skyStars.push({x:Math.random(), y:Math.random()*0.8, r:0.8+Math.random()*1.6, tw:Math.random()*6});
function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixColor(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
function levelFor(sc){ return Math.min(LEVELS.length-1, Math.floor(sc/PER_LEVEL)); }
function setLevel(i){
  if (i===levelIdx) return;
  prevLevel = LEVELS[levelIdx]; levelIdx=i; levelBlend=0; invuln=Math.max(invuln,2);
  document.getElementById('level').textContent = i+1;
  bravoText.textContent = 'LIVELLO '+(i+1)+'!'; bravoText.style.fontSize='';
  levelName.textContent = LEVELS[i].name; levelName.hidden=false;
  bravoEl.hidden=false; bravoTimer=2.4; fanfare(); setTimeout(fanfare, 450);
  for(let k=0;k<60;k++) confetti.push({x:Math.random()*W, y:-20-Math.random()*H*0.3, vx:(Math.random()-0.5)*60, vy:120+Math.random()*160, rot:Math.random()*6, vr:(Math.random()-0.5)*8, color:BALLOON_COLORS[k%BALLOON_COLORS.length], w:8+Math.random()*8, h:5+Math.random()*5});
}

/* ---------- game state ---------- */
let state='menu', score=0, streak=0, lastT=0, time=0;
const plane={x:0,y:0,tx:0,ty:0,vy:0,tilt:0};
let items=[], clouds=[], farClouds=[], particles=[], birds=[], confetti=[];
let spawnTimer=0, cloudTimer=0, birdTimer=0, bravoTimer=0, hintTimer=0;
const keys={};
let pointerDown=false;
const MAX_LIVES = 5, BONUS_SECONDS = 60;
let lives=MAX_LIVES, crashT=0, invuln=0, shake=0, booms=[], bonus=false, bonusLeft=0, lastTickSec=0;
const HEART='<svg viewBox="0 0 24 24"><path fill="#ff4f7a" stroke="#c2185b" stroke-width="1.5" stroke-linejoin="round" d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3.2 4.5 6.8 4.5c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
function renderLives(){
  livesEl.innerHTML = Array.from({length:MAX_LIVES},(_,i)=>HEART.replace('<svg', i<lives?'<svg':'<svg class="lost"')).join('');
  livesEl.setAttribute('aria-label', lives===1 ? '1 vita' : lives+' vite');
}
function engineOn(on){ if(engine) engine.g.gain.setTargetAtTime(on?0.12:0, AC.currentTime, on?0.3:0.05); }
function showOnly(el){ for (const o of [menu,pauseEl,overEl,endEl]) o.hidden = (o!==el); }
function respawn(){
  plane.x=W*0.25; plane.y=Math.min(H*0.4, H-220); plane.y=Math.max(plane.y, 80);
  plane.tx=plane.x; plane.ty=plane.y; plane.vy=0; plane.tilt=0; invuln=2.2; crashT=0; engineOn(true);
}

function startGame(){
  audioInit();
  state='play'; score=0; streak=0; items=[]; particles=[]; confetti=[]; birds=[]; booms=[];
  lives=MAX_LIVES; renderLives(); bonus=false; shake=0; livesEl.hidden=false; timerPill.hidden=true; timerPill.classList.remove('low');
  respawn(); invuln=1.5;
  scoreEl.textContent='0'; levelIdx=0; levelBlend=1; prevLevel=LEVELS[0]; document.getElementById('level').textContent='1'; fishJump=[];
  showOnly(null); hud.hidden=false; hint.hidden=false; hintTimer=6; bravoEl.hidden=true;
  spawnTimer=0.4;
  try { if(document.fullscreenElement==null && document.documentElement.requestFullscreen && window.innerWidth<700) document.documentElement.requestFullscreen().catch(()=>{}); } catch(e){}
}
function goMenu(){
  state='menu'; showOnly(menu); hud.hidden=true; hint.hidden=true; bravoEl.hidden=true; booms=[]; shake=0;
  engineOn(false);
}
function pauseGame(){
  if (state!=='play') return;
  state='pause'; pointerDown=false; showOnly(pauseEl); engineOn(false); if(AC) AC.suspend();
}
function resumeGame(){
  if (state!=='pause') return;
  audioInit(); state='play'; showOnly(null); if (crashT<=0) engineOn(true);
}
function doCrash(){
  crashT=1.6; pointerDown=false; shake=0.5; streak=0;
  boomSound(); engineOn(false);
  try { if (navigator.vibrate) navigator.vibrate(250); } catch(e){}
  booms.push({x:plane.x, y:plane.y, t:0});
  for (const c of ['#ff6f3c','#ffd54a','#ff4f4f']) burst(plane.x,plane.y,c,14);
  const pc = PLANES[planeIdx];
  for (let i=0;i<8;i++) { const a=-Math.PI*Math.random(), v=150+Math.random()*200; particles.push({x:plane.x,y:plane.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.3,t:0,color:i%2?pc.body:pc.wing,r:7+Math.random()*4}); }
  for (let i=0;i<10;i++) particles.push({x:plane.x+(Math.random()-0.5)*30,y:plane.y,vx:(Math.random()-0.5)*60,vy:-30-Math.random()*60,life:1.4,t:0,color:'#8d95a8',r:10+Math.random()*10,smoke:true});
  if (!bonus) { lives=Math.max(0,lives-1); renderLives(); }
}
function gameOver(){
  state='over'; hud.hidden=true; hint.hidden=true; bravoEl.hidden=true; engineOn(false);
  document.getElementById('over-score').textContent=score; showOnly(overEl); wahWah();
}
function startBonus(){
  if (state!=='over') return;
  audioInit(); state='play'; bonus=true; bonusLeft=BONUS_SECONDS; lastTickSec=0;
  showOnly(null); hud.hidden=false; livesEl.hidden=true; timerPill.hidden=false; timerPill.classList.remove('low'); timerEl.textContent=BONUS_SECONDS;
  respawn(); fanfare();
  bravoText.textContent='1 MINUTO!'; levelName.hidden=true; bravoEl.hidden=false; bravoTimer=1.6;
}
function endGame(){
  state='end'; hud.hidden=true; hint.hidden=true; bravoEl.hidden=true; engineOn(false); crashT=0;
  document.getElementById('end-score').textContent=score; showOnly(endEl); fanfare(); setTimeout(fanfare,500);
  for(let i=0;i<120;i++) confetti.push({x:Math.random()*W, y:-20-Math.random()*H*0.4, vx:(Math.random()-0.5)*60, vy:120+Math.random()*160, rot:Math.random()*6, vr:(Math.random()-0.5)*8, color:BALLOON_COLORS[i%BALLOON_COLORS.length], w:8+Math.random()*8, h:5+Math.random()*5});
}
document.getElementById('play').addEventListener('click', startGame);
document.getElementById('home').addEventListener('click', goMenu);
document.getElementById('pause-btn').addEventListener('click', pauseGame);
document.getElementById('resume').addEventListener('click', resumeGame);
document.getElementById('pause-home').addEventListener('click', goMenu);
document.getElementById('sun').addEventListener('click', startBonus);
document.getElementById('over-home').addEventListener('click', goMenu);
document.getElementById('again').addEventListener('click', startGame);
document.getElementById('end-home').addEventListener('click', goMenu);
renderLives();

/* ---------- input: the plane goes where the finger is ---------- */
function setTarget(e){
  const r=cv.getBoundingClientRect();
  plane.tx = Math.min(W*0.6, Math.max(40, e.clientX-r.left));
  plane.ty = Math.min(H-40, Math.max(40, e.clientY-r.top));
}
cv.addEventListener('pointerdown', e=>{ if(state!=='play' || crashT>0) return; pointerDown=true; setTarget(e); hint.hidden=true; });
cv.addEventListener('pointermove', e=>{ if(state==='play' && pointerDown && crashT<=0) setTarget(e); });
window.addEventListener('pointerup', ()=>pointerDown=false);
window.addEventListener('pointercancel', ()=>pointerDown=false);
window.addEventListener('keydown', e=>{ keys[e.key]=true; if(state==='play' && e.key.startsWith('Arrow')) { e.preventDefault(); hint.hidden=true; } const go = e.key===' '||e.key==='Enter';
  if (e.key==='p'||e.key==='P'||e.key==='Escape') { if (state==='play') pauseGame(); else if (state==='pause') resumeGame(); return; }
  if (!go || e.repeat) return;
  if (state==='menu'||state==='end') startGame(); else if (state==='pause') resumeGame(); else if (state==='over') startBonus(); });
window.addEventListener('keyup', e=>keys[e.key]=false);

/* ---------- world ---------- */
function makeCloud(far, x){
  const s = far ? 0.5+Math.random()*0.4 : 0.9+Math.random()*0.8;
  return {x: x ?? W+120*s, y: Math.random()*H*0.9, s, far, puffs:[0,1,2,3].map(i=>({dx:(i-1.5)*34, dy:(Math.random()-0.5)*14, r:26+Math.random()*16})), wob:0};
}
for(let i=0;i<4;i++) farClouds.push(makeCloud(true, Math.random()*W));
for(let i=0;i<3;i++) clouds.push(makeCloud(false, Math.random()*W));

function spawnItem(){
  const L=LEVELS[levelIdx], y = 70+Math.random()*Math.max(40, H-270);
  if (Math.random()<0.08) { items.push({kind:'rainbow', x:W+60, y, r:30, ph:0}); return; }
  const kind = L.items[Math.floor(Math.random()*L.items.length)];
  const it = {kind, x:W+40, y, r:24, ph:Math.random()*6, spin:Math.random()*6, color:BALLOON_COLORS[Math.floor(Math.random()*BALLOON_COLORS.length)]};
  if (kind==='star') it.r=22; if (kind==='balloon') it.r=26; if (kind==='planet') it.r=28;
  items.push(it);
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=120+Math.random()*220;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.7+Math.random()*0.4,t:0,color,r:4+Math.random()*5}); }
}
function sayBravo(){
  bravoText.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)]; levelName.hidden=true;
  bravoEl.hidden=false; bravoTimer=1.6; fanfare();
  for(let i=0;i<90;i++) confetti.push({x:Math.random()*W, y:-20-Math.random()*H*0.3, vx:(Math.random()-0.5)*60, vy:120+Math.random()*160, rot:Math.random()*6, vr:(Math.random()-0.5)*8, color:BALLOON_COLORS[i%BALLOON_COLORS.length], w:8+Math.random()*8, h:5+Math.random()*5});
}

function update(dt){
  if (state==='pause') return;
  time+=dt;
  const speed = W*0.28*LEVELS[levelIdx].speed; // px/s, gentle
  if (levelBlend<1) levelBlend=Math.min(1, levelBlend+dt/1.5);
  groundOff += speed*0.5*dt;
  if (state==='play' && LEVELS[levelIdx].ground==='sea') { levelTimer-=dt; if (levelTimer<=0){ fishJump.push({x:Math.random()*W, t:0}); levelTimer=2+Math.random()*3; } }
  for (let i=fishJump.length-1;i>=0;i--){ fishJump[i].t+=dt; fishJump[i].x-=speed*0.5*dt; if (fishJump[i].t>1.4) fishJump.splice(i,1); }
  // clouds
  for (const arr of [farClouds, clouds]) for (const c of arr) { c.x -= speed*(c.far?0.25:0.55)*c.s*dt; c.wob*=0.92; if (c.x < -200*c.s) { Object.assign(c, makeCloud(c.far)); } }
  // particles, confetti and explosions keep moving on every screen
  for (let i=particles.length-1;i>=0;i--) { const p=particles[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if (p.smoke) { p.r+=14*dt; p.vx*=0.97; } else { p.vy+=300*dt; p.vx*=0.98; } if (p.t>p.life) particles.splice(i,1); }
  for (let i=confetti.length-1;i>=0;i--) { const c=confetti[i]; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; if (c.y>H+30) confetti.splice(i,1); }
  for (let i=booms.length-1;i>=0;i--) { booms[i].t+=dt; if (booms[i].t>0.7) booms.splice(i,1); }
  if (shake>0) shake=Math.max(0, shake-dt);
  if (state!=='play') return;

  // one-minute bonus after tapping the sun
  if (bonus) {
    bonusLeft -= dt; const sec=Math.max(0, Math.ceil(bonusLeft));
    timerEl.textContent=sec; timerPill.classList.toggle('low', sec<=10);
    if (sec<=5 && sec!==lastTickSec && sec>0) { lastTickSec=sec; tickSound(); }
    if (bonusLeft<=0) { endGame(); return; }
  }
  // after a crash: wait, then respawn or game over
  if (crashT>0) { crashT-=dt; if (crashT<=0) { if (!bonus && lives<=0) { gameOver(); return; } respawn(); } }
  if (invuln>0) invuln-=dt;
  const alive = crashT<=0;
  if (alive) {
  // keyboard moves the target
  const ks = 420*dt;
  if (keys.ArrowUp) plane.ty-=ks; if (keys.ArrowDown) plane.ty+=ks; if (keys.ArrowLeft) plane.tx-=ks; if (keys.ArrowRight) plane.tx+=ks;
  plane.tx=Math.min(W*0.6,Math.max(40,plane.tx)); plane.ty=Math.min(H-40,Math.max(40,plane.ty));
  // plane eases toward the target
  const k = 1-Math.pow(0.001, dt);
  const ny = plane.y + (plane.ty-plane.y)*k*0.9;
  plane.vy = (ny-plane.y)/dt; plane.y=ny;
  plane.x += (plane.tx-plane.x)*k*0.6;
  plane.y += Math.sin(time*2.2)*0.25; // idle bob
  const targetTilt = Math.max(-0.35, Math.min(0.35, plane.vy/900));
  plane.tilt += (targetTilt-plane.tilt)*Math.min(1,dt*8);
  if (engine) engine.osc.frequency.setTargetAtTime(70+Math.abs(plane.vy)*0.05, AC.currentTime, 0.1);
  // touching the ground makes the plane go boom
  if (invuln<=0) { const s=planeScale(), bottom=plane.y+16*s, G=LEVELS[levelIdx].ground;
    for (const ox of [-28,0,28]) if (bottom > groundTop(G, plane.x+ox*s)) { doCrash(); break; } }
  }

  // hint
  if (hintTimer>0) { hintTimer-=dt; if(hintTimer<=0) hint.hidden=true; }
  if (bravoTimer>0) { bravoTimer-=dt; if (bravoTimer<=0) bravoEl.hidden=true; }

  // spawn
  spawnTimer-=dt; if (spawnTimer<=0) { spawnItem(); spawnTimer = 0.9+Math.random()*0.8; }
  birdTimer-=dt; if (birdTimer<=0) { birds.push({x:W+40, y:60+Math.random()*H*0.5, flap:0, s:0.8+Math.random()*0.5}); birdTimer=6+Math.random()*8; }

  // items
  const pr = planeScale();
  for (let i=items.length-1;i>=0;i--) {
    const it=items[i]; it.x -= speed*dt; it.ph += dt; it.y += Math.sin(it.ph*2)*0.3;
    if (it.kind==='star') it.spin += dt*2;
    const dx=it.x-plane.x, dy=it.y-plane.y, hit = (it.r+38*pr);
    if (alive && dx*dx+dy*dy < hit*hit) {
      items.splice(i,1);
      const before=score;
      if (it.kind==='rainbow') { score+=3; streak+=3; fanfare(); for (const c of BALLOON_COLORS) burst(it.x,it.y,c,6); }
      else if (it.kind==='balloon'||it.kind==='candy') { score++; streak++; popSound(); burst(it.x,it.y,it.color,22); }
      else { score++; streak++; chime(streak); burst(it.x,it.y, it.kind==='star'?'#ffd54a': it.kind==='heart'?'#ff4f7a': it.kind==='snow'?'#ffffff': it.kind==='fish'?'#ff9f43': it.color,16); }
      scoreEl.textContent=score;
      const nl = levelFor(score);
      if (nl!==levelIdx) setLevel(nl);
      else if (Math.floor(score/PER_LEVEL) > Math.floor(before/PER_LEVEL)) sayBravo();
    } else if (it.x < -80) { items.splice(i,1); streak=0; }
  }
  // cloud pass-through: soft puff, no penalty
  for (const c of clouds) { const dx=c.x-plane.x, dy=c.y-plane.y; if (Math.abs(dx)<70*c.s && Math.abs(dy)<40*c.s && c.wob<0.1 && !c.inside) { c.wob=1; c.inside=true; puff(); } else if (Math.abs(dx)>90*c.s||Math.abs(dy)>60*c.s) c.inside=false; }
  // birds
  for (let i=birds.length-1;i>=0;i--) { const b=birds[i]; b.x -= speed*0.7*dt; b.flap+=dt*10; b.y+=Math.sin(b.flap*0.5)*0.4; if (b.x<-60) birds.splice(i,1); }
  // particles
}

/* ---------- drawing ---------- */
function drawCloud(c, alpha){
  ctx.save(); ctx.translate(c.x, c.y + Math.sin(time*3+c.x)*c.wob*6); ctx.scale(c.s*(1+c.wob*0.08), c.s*(1-c.wob*0.08));
  ctx.globalAlpha=alpha; ctx.fillStyle='#fff';
  ctx.beginPath(); for (const p of c.puffs) { ctx.moveTo(p.dx+p.r,p.dy); ctx.arc(p.dx,p.dy,p.r,0,Math.PI*2); } ctx.fill();
  ctx.fillStyle='rgba(120,180,230,.25)'; ctx.beginPath(); ctx.ellipse(0,20,70,10,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawStar(x,y,r,rot,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
  for (let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*0.45:r; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  ctx.closePath(); ctx.fillStyle=color; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#f0a500'; ctx.lineJoin='round'; ctx.stroke(); ctx.restore();
}
function drawBalloon(it){
  ctx.save(); ctx.translate(it.x,it.y);
  ctx.strokeStyle='rgba(29,53,87,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,it.r); ctx.quadraticCurveTo(6,it.r+20, 0,it.r+40); ctx.stroke();
  ctx.fillStyle=it.color; ctx.beginPath(); ctx.ellipse(0,0,it.r*0.85,it.r,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5,it.r-2); ctx.lineTo(5,it.r-2); ctx.lineTo(0,it.r+6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-it.r*0.3,-it.r*0.35,it.r*0.22,it.r*0.35,-0.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawRainbow(it){
  ctx.save(); ctx.translate(it.x,it.y+12); ctx.lineWidth=6;
  ['#ff4f4f','#fb923c','#ffd54a','#3ccf91','#3b82f6','#a855f7'].forEach((c,i)=>{ ctx.strokeStyle=c; ctx.beginPath(); ctx.arc(0,0,it.r+6-i*6,Math.PI,0); ctx.stroke(); });
  ctx.fillStyle='#fff'; for (const sx of [-it.r-2, it.r+2]) { ctx.beginPath(); ctx.arc(sx,2,10,0,Math.PI*2); ctx.arc(sx+(sx<0?8:-8),-4,9,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawBird(b){
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(b.s,b.s); ctx.strokeStyle='#1d3557'; ctx.lineWidth=3; ctx.lineCap='round';
  const f=Math.sin(b.flap)*8; ctx.beginPath(); ctx.moveTo(-18,f); ctx.quadraticCurveTo(-9,-8,0,0); ctx.quadraticCurveTo(9,-8,18,f); ctx.stroke(); ctx.restore();
}

function drawHeart(it){
  ctx.save(); ctx.translate(it.x,it.y); const r=it.r*0.9; ctx.fillStyle='#ff4f7a'; ctx.strokeStyle='#c2185b'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,r*0.9); ctx.bezierCurveTo(-r*1.3,-r*0.1,-r*0.7,-r*1.1,0,-r*0.4); ctx.bezierCurveTo(r*0.7,-r*1.1,r*1.3,-r*0.1,0,r*0.9); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.18,r*0.28,-0.5,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function drawFish(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.scale(-1,1); const r=it.r; ctx.fillStyle='#ff9f43'; ctx.strokeStyle='#d35400'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,r,r*0.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  const f=Math.sin(it.ph*10)*6; ctx.beginPath(); ctx.moveTo(-r*0.9,0); ctx.lineTo(-r*1.5,-r*0.6+f); ctx.lineTo(-r*1.5,r*0.6+f); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*0.45,-r*0.15,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.arc(r*0.5,-r*0.15,2.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(i*8-4,0,6,-1,1); ctx.stroke(); } ctx.restore();
}
function drawSnow(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.spin*0.5); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.shadowColor='rgba(80,160,255,.6)'; ctx.shadowBlur=8;
  for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-it.r); ctx.moveTo(0,-it.r*0.6); ctx.lineTo(-6,-it.r*0.8); ctx.moveTo(0,-it.r*0.6); ctx.lineTo(6,-it.r*0.8); ctx.stroke(); } ctx.restore();
}
function drawPlanet(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.fillStyle=it.color; ctx.beginPath(); ctx.arc(0,0,it.r*0.75,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(-it.r*0.25,-it.r*0.2,it.r*0.18,0,Math.PI*2); ctx.arc(it.r*0.2,it.r*0.25,it.r*0.12,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(0,0,it.r*1.3,it.r*0.35,-0.4,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function drawRocket(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(-0.3); const r=it.r;
  ctx.fillStyle='rgba(255,160,60,.8)'; ctx.beginPath(); ctx.moveTo(-r*0.8,-r*0.3); ctx.lineTo(-r*1.6+Math.random()*8,0); ctx.lineTo(-r*0.8,r*0.3); ctx.fill();
  ctx.fillStyle='#eee'; ctx.strokeStyle='#1d3557'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,0,r,r*0.45,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff4f4f'; ctx.beginPath(); ctx.moveTo(-r*0.6,-r*0.3); ctx.lineTo(-r*1.1,-r*0.9); ctx.lineTo(-r*0.4,-r*0.1); ctx.fill(); ctx.beginPath(); ctx.moveTo(-r*0.6,r*0.3); ctx.lineTo(-r*1.1,r*0.9); ctx.lineTo(-r*0.4,r*0.1); ctx.fill();
  ctx.fillStyle='#4fb3ff'; ctx.beginPath(); ctx.arc(r*0.2,0,r*0.22,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawFlower(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.spin*0.3); ctx.fillStyle=it.color;
  for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.ellipse(0,-it.r*0.6,it.r*0.35,it.r*0.6,0,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#ffd54a'; ctx.strokeStyle='#f0a500'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,it.r*0.4,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawButterfly(it){
  ctx.save(); ctx.translate(it.x,it.y); const f=Math.abs(Math.sin(it.ph*8))*0.6+0.4;
  for (const sgn of [-1,1]) { ctx.save(); ctx.scale(sgn*f,1); ctx.fillStyle=it.color; ctx.beginPath(); ctx.ellipse(it.r*0.6,-it.r*0.4,it.r*0.6,it.r*0.5,0.3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(it.r*0.5,it.r*0.4,it.r*0.45,it.r*0.4,-0.3,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(it.r*0.6,-it.r*0.4,it.r*0.18,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.ellipse(0,0,it.r*0.15,it.r*0.8,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function drawCandy(it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.spin*0.4); const r=it.r*0.75; ctx.fillStyle=it.color; ctx.strokeStyle='#1d3557'; ctx.lineWidth=2.5;
  for (const sgn of [-1,1]) { ctx.beginPath(); ctx.moveTo(sgn*r*0.8,0); ctx.lineTo(sgn*r*1.6,-r*0.6); ctx.lineTo(sgn*r*1.5,0); ctx.lineTo(sgn*r*1.6,r*0.6); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=4; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.5-r*0.3,-r*0.8); ctx.lineTo(i*r*0.5+r*0.3,r*0.8); ctx.stroke(); } ctx.restore();
}
function drawItem(it){
  switch(it.kind){
    case 'star': return drawStar(it.x,it.y,it.r+Math.sin(it.ph*4)*2,it.spin,'#ffd54a');
    case 'balloon': return drawBalloon(it);
    case 'rainbow': return drawRainbow(it);
    case 'heart': return drawHeart(it);
    case 'fish': return drawFish(it);
    case 'snow': return drawSnow(it);
    case 'planet': return drawPlanet(it);
    case 'rocket': return drawRocket(it);
    case 'flower': return drawFlower(it);
    case 'butterfly': return drawButterfly(it);
    case 'candy': return drawCandy(it);
  }
}
function drawSky(){
  const L=LEVELS[levelIdx], t=levelBlend;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, mixColor(prevLevel.top,L.top,t)); g.addColorStop(1, mixColor(prevLevel.bot,L.bot,t));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const night = (L.sky==='moon'||L.sky==='stars') ? t : ((prevLevel.sky==='moon'||prevLevel.sky==='stars') ? 1-t : 0);
  if (night>0) { ctx.fillStyle='#fff'; for (const st of skyStars) { ctx.globalAlpha=night*(0.5+0.5*Math.sin(time*2+st.tw)); ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
  // celestial body
  ctx.save(); ctx.translate(W-90, 90);
  if (L.sky==='moon') { ctx.fillStyle='#fff7c2'; ctx.beginPath(); ctx.arc(0,0,44,0,Math.PI*2); ctx.fill(); ctx.fillStyle=mixColor(prevLevel.top,L.top,t); ctx.beginPath(); ctx.arc(18,-10,36,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.arc(-22,-4,3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#1d3557'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(-14,6,10,0.3*Math.PI,0.8*Math.PI); ctx.stroke(); }
  else if (L.sky==='stars') { ctx.fillStyle='#b088f9'; ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#ffd54a'; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(0,0,66,16,-0.35,0,Math.PI*2); ctx.stroke(); }
  else if (L.sky==='rainbow') { ctx.lineWidth=14; ['#ff4f4f','#fb923c','#ffd54a','#3ccf91','#3b82f6','#a855f7'].forEach((c,i)=>{ ctx.strokeStyle=c; ctx.globalAlpha=0.7; ctx.beginPath(); ctx.arc(-W*0.4,H*0.9-90, W*0.55-i*14, Math.PI*1.05, Math.PI*1.95); ctx.stroke(); }); ctx.globalAlpha=1; }
  else { const big=L.sky==='bigsun'; const R=big?70:48; ctx.fillStyle='rgba(255,213,74,.35)'; ctx.beginPath(); ctx.arc(0,0,R+22+Math.sin(time)*3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=big?'#ffb347':'#ffd54a'; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.arc(-14,-6,4,0,Math.PI*2); ctx.arc(14,-6,4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1d3557'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,4,18,0.25*Math.PI,0.75*Math.PI); ctx.stroke(); }
  ctx.restore();
}
function tri(v,per){ const m=((v%per)+per)%per; return Math.abs(m-per/2)/(per/2); }
function bh(i){ return 50+(((i*37)%70)+70)%70; }
// y of the solid ground at screen x for a given world; the plane crashes below it
function groundTop(G,x){
  switch(G){
    case 'sea': return H-60+Math.sin((x+groundOff*2)/60)*8+Math.sin((x-groundOff)/35)*4;
    case 'hills': return Math.min(H-40-Math.sin((x+groundOff*0.6)/140)*40, H-88-Math.sin((x+groundOff)/140)*28);
    case 'meadow': return H-70-Math.sin((x+groundOff*0.8)/120)*14;
    case 'mountains': return H-20-tri(x+groundOff*0.6,220)*120;
    case 'city': { const u=x+groundOff*0.7, i=Math.floor(u/80); return (u-i*80)<60 ? H-bh(i) : H-14; }
    case 'moon': return H-48-Math.sin((x+groundOff*0.9)/90)*7;
  }
  return H+100;
}
function fillTop(col, fn, step){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W+step;x+=step) ctx.lineTo(x,fn(x)); ctx.lineTo(W+step,H); ctx.closePath(); ctx.fill(); }
function drawGround(){
  const L=LEVELS[levelIdx], base=H;
  const drawFor=(G,alpha)=>{ if (alpha<=0) return; ctx.save(); ctx.globalAlpha=alpha;
    if (G==='sea') { fillTop('#2b7fd6', x=>groundTop('sea',x), 16);
      ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=3; ctx.beginPath(); for(let x=0;x<=W;x+=16) ctx.lineTo(x, groundTop('sea',x)+2); ctx.stroke();
      for (const f of fishJump) { const u=f.t/1.4, y=base-60-Math.sin(u*Math.PI)*110; ctx.save(); ctx.translate(f.x,y); ctx.rotate((u-0.5)*2.2); ctx.fillStyle='#5dade2'; ctx.beginPath(); ctx.ellipse(0,0,22,12,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(-34,-12); ctx.lineTo(-34,12); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10,-3,4,0,Math.PI*2); ctx.fill(); ctx.restore(); } }
    else if (G==='hills') { fillTop('#8fd16a', x=>H-40-Math.sin((x+groundOff*0.6)/140)*40, 16); fillTop('#5fbf4a', x=>H-88-Math.sin((x+groundOff)/140)*28, 16); }
    else if (G==='meadow') { ctx.fillStyle='#6fcf5a'; ctx.fillRect(0,base-56,W,56); fillTop('#8fe07a', x=>groundTop('meadow',x), 16);
      const off=groundOff*0.8; for (let i=Math.floor(off/90); i*90-off<W+20; i++) { const x=i*90-off+45, top=groundTop('meadow',x); const c=BALLOON_COLORS[((i%BALLOON_COLORS.length)+BALLOON_COLORS.length)%BALLOON_COLORS.length];
        ctx.strokeStyle='#3a9d3a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,top+26); ctx.lineTo(x,top+4); ctx.stroke(); ctx.fillStyle=c; for(let k=0;k<5;k++){ const a=k*Math.PI*2/5; ctx.beginPath(); ctx.arc(x+Math.cos(a)*7,top+Math.sin(a)*7,5.5,0,Math.PI*2); ctx.fill(); } ctx.fillStyle='#ffd54a'; ctx.beginPath(); ctx.arc(x,top,4.5,0,Math.PI*2); ctx.fill(); } }
    else if (G==='mountains') { ctx.globalAlpha=alpha*0.45; fillTop('#b9cde3', x=>H-20-tri(x+groundOff*0.3,300)*200, 12); ctx.globalAlpha=alpha;
      fillTop('#6f8fb3', x=>groundTop('mountains',x), 8);
      ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); let on=false;
      for(let x=0;x<=W;x+=4){ const h=tri(x+groundOff*0.6,220); if (h>0.78) { const y=groundTop('mountains',x); on ? ctx.lineTo(x,y) : ctx.moveTo(x,y); on=true; } else on=false; } ctx.stroke(); }
    else if (G==='city') { const off=groundOff*0.7; ctx.fillStyle='#141a3a'; ctx.fillRect(0,base-14,W,14);
      for (let i=Math.floor(off/80)-1; i*80-off<W+80; i++) { const x=i*80-off, h=bh(i); ctx.fillStyle='#141a3a'; ctx.fillRect(x,base-h,60,h); ctx.fillStyle='#ffe28a';
        for(let wy=base-h+12; wy<base-20; wy+=18) for (let wx=x+10; wx<x+52; wx+=16) if (((i*7+wy+Math.round(wx-x))%5+5)%5!==0) ctx.fillRect(wx,wy,7,9); } }
    else if (G==='moon') { fillTop('#c9c6d8', x=>groundTop('moon',x), 12);
      const off=groundOff*0.9; ctx.fillStyle='#a9a5bd'; for (let i=Math.floor(off/130); i*130-off<W+60; i++) { const x=i*130-off+40+((i*53)%40); ctx.beginPath(); ctx.ellipse(x, groundTop('moon',x)+22, 18+((i*17)%12), 6, 0, 0, Math.PI*2); ctx.fill(); } }
    ctx.restore(); };
  if (prevLevel.ground!==L.ground) drawFor(prevLevel.ground, 1-levelBlend);
  drawFor(L.ground, prevLevel.ground!==L.ground ? levelBlend : 1);
}
function drawBoom(b){
  const u=b.t/0.7, r=30+u*90; ctx.save(); ctx.translate(b.x,b.y); ctx.globalAlpha=Math.max(0,1-u);
  for (const [col,k] of [['#ff6f3c',1],['#ffd54a',0.65],['#ffffff',0.3]]) { ctx.fillStyle=col; ctx.beginPath();
    for (let i=0;i<16;i++){ const a=i*Math.PI/8+u, rr=(i%2? r*0.55 : r)*k; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save(); if (shake>0) ctx.translate((Math.random()-0.5)*shake*30, (Math.random()-0.5)*shake*30);
  drawSky();
  const cA = LEVELS[levelIdx].cloudA*levelBlend + prevLevel.cloudA*(1-levelBlend);
  for (const c of farClouds) drawCloud(c, 0.65*cA);
  drawGround();
  for (const b of birds) drawBird(b);
  if (state==='play' || state==='pause') {
    for (const it of items) drawItem(it);
    if (crashT<=0 && !(invuln>0 && Math.floor(invuln*8)%2)) drawPlane(plane.x, plane.y, plane.tilt, PLANES[planeIdx], time);
  } else if (state!=='over') {
    // menu: plane cruises along the bottom
    drawPlane(W*0.5 + Math.sin(time*0.7)*W*0.25, H*0.62 + Math.sin(time*1.4)*10, Math.cos(time*0.7)*0.12, PLANES[planeIdx], time);
  }
  for (const c of clouds) drawCloud(c, cA);
  for (const b of booms) drawBoom(b);
  for (const p of particles) { ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  for (const c of confetti) { ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore(); }
  ctx.restore();
}

function loop(ts){
  if (!lastT) lastT=ts; let dt=(ts-lastT)/1000; lastT=ts; if (dt>0.05) dt=0.05;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) { if (state==='play') pauseGame(); else if (AC) AC.suspend(); } });
})();
</script>
</body>
